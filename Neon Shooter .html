<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>نئون‌گرد — Neon Runner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#05030f;}
  body{
    font-family: Tahoma, 'Segoe UI', system-ui, -apple-system, sans-serif;
    color:#dff6ff;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
  }
  canvas{display:block;position:fixed;inset:0;touch-action:none;}

  /* ===== HUD ===== */
  #hud{
    position:fixed;inset:0;pointer-events:none;
    padding:14px 18px;
    padding-top:max(14px, env(safe-area-inset-top));
    display:flex;justify-content:space-between;align-items:flex-start;
    opacity:0;transition:opacity .35s;
    direction:ltr;
  }
  #hud.on{opacity:1;}
  .panel{
    background:rgba(10,6,30,.45);
    border:1px solid rgba(0,229,255,.22);
    border-radius:14px;
    padding:8px 14px;
    backdrop-filter:blur(8px);
    display:flex;gap:16px;align-items:center;
    box-shadow:0 0 22px rgba(0,229,255,.12), inset 0 0 20px rgba(0,229,255,.05);
  }
  .stat{display:flex;flex-direction:column;align-items:center;line-height:1.15;}
  .stat .label{font-size:9px;letter-spacing:.12em;color:#7fb6cc;text-transform:uppercase;}
  .stat .val{font-size:19px;font-weight:bold;color:#7df9ff;text-shadow:0 0 10px rgba(0,229,255,.8);font-variant-numeric:tabular-nums;}
  #lives{display:flex;gap:6px;align-items:center;padding:10px 14px;}
  .heart{
    width:13px;height:13px;border-radius:3px;
    background:#ff2d95;
    box-shadow:0 0 10px #ff2d95, 0 0 20px rgba(255,45,149,.6);
    transform:rotate(45deg);
    transition:.25s;
  }
  .heart.off{background:#33152a;box-shadow:none;opacity:.45;}
  .shieldIcon{
    width:15px;height:15px;border-radius:50%;
    border:2px solid #00e5ff;background:rgba(0,229,255,.18);
    box-shadow:0 0 10px #00e5ff;
    transition:.25s;
  }
  .shieldIcon.off{opacity:.2;box-shadow:none;border-color:#1d3d4a;background:transparent;}

  /* ===== Boss bar ===== */
  #bossbar{
    position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-100%);
    width:min(70vw,560px);padding:10px 0 0;transition:transform .4s cubic-bezier(.2,.9,.3,1.3);
    pointer-events:none;
  }
  #bossbar.on{transform:translateX(-50%) translateY(0);}
  #bossbar .frame{
    height:12px;border-radius:8px;
    background:rgba(10,6,30,.7);
    border:1px solid rgba(255,45,149,.5);
    box-shadow:0 0 20px rgba(255,45,149,.35);
    overflow:hidden;position:relative;
  }
  #bossfill{
    height:100%;width:100%;
    background:linear-gradient(90deg,#ff2d95,#ff8a3d,#ffd166);
    box-shadow:0 0 16px #ff2d95;
    transition:width .18s linear;
    border-radius:8px;
  }
  #bossbar .cap{
    text-align:center;font-size:10px;letter-spacing:.28em;
    color:#ff8ab5;margin-top:5px;text-shadow:0 0 10px rgba(255,45,149,.8);
  }

  /* ===== Overlays ===== */
  .overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(circle at 50% 42%, rgba(28,10,60,.78), rgba(3,2,10,.96) 70%);
    backdrop-filter:blur(7px);
    text-align:center;padding:26px;
    opacity:0;pointer-events:none;transition:opacity .35s;
    z-index:10;
  }
  .overlay.on{opacity:1;pointer-events:auto;}

  h1{
    font-size:clamp(40px,11vw,78px);
    font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(180deg,#b6fbff,#00e5ff 45%,#ff2d95);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 26px rgba(0,229,255,.65)) drop-shadow(0 0 60px rgba(255,45,149,.35));
    line-height:1.1;
  }
  .sub{font-size:clamp(12px,3.4vw,15px);color:#8fbdd4;letter-spacing:.06em;}

  .btn{
    font-family:inherit;
    font-size:clamp(15px,4vw,18px);
    font-weight:bold;
    padding:14px 42px;
    border-radius:999px;
    border:1.5px solid rgba(0,229,255,.75);
    background:linear-gradient(180deg, rgba(0,229,255,.18), rgba(0,229,255,.04));
    color:#c9f7ff;
    cursor:pointer;
    letter-spacing:.04em;
    box-shadow:0 0 22px rgba(0,229,255,.35), inset 0 0 22px rgba(0,229,255,.1);
    transition:transform .16s, box-shadow .25s, background .25s;
    text-shadow:0 0 12px rgba(0,229,255,.8);
  }
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 38px rgba(0,229,255,.65), inset 0 0 30px rgba(0,229,255,.2);}
  .btn:active{transform:scale(.97);}
  .btn.pink{
    border-color:rgba(255,45,149,.8);
    background:linear-gradient(180deg, rgba(255,45,149,.2), rgba(255,45,149,.05));
    color:#ffd4e8;
    box-shadow:0 0 22px rgba(255,45,149,.4), inset 0 0 22px rgba(255,45,149,.1);
    text-shadow:0 0 12px rgba(255,45,149,.85);
  }
  .btn.pink:hover{box-shadow:0 0 38px rgba(255,45,149,.7), inset 0 0 30px rgba(255,45,149,.22);}

  .hints{
    display:flex;flex-direction:column;gap:7px;margin-top:8px;
    font-size:clamp(11px,3.1vw,13px);color:#7ea8bd;line-height:1.9;
  }
  .hints b{color:#7df9ff;font-weight:bold;}
  .key{
    display:inline-block;padding:1px 8px;border-radius:6px;
    background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);
    color:#9fe9ff;font-size:.9em;
  }

  .scoreBig{
    font-size:clamp(34px,10vw,58px);font-weight:900;color:#7df9ff;
    text-shadow:0 0 26px rgba(0,229,255,.85);
    font-variant-numeric:tabular-nums;line-height:1.15;
  }
  .scoreRow{display:flex;gap:34px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .scoreCell{display:flex;flex-direction:column;gap:3px;align-items:center;}
  .scoreCell .k{font-size:10px;letter-spacing:.2em;color:#7fb6cc;}
  .best{color:#ffd166;text-shadow:0 0 20px rgba(255,209,102,.8);}

  /* pause + sound buttons */
  #topbtns{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;z-index:6;opacity:0;pointer-events:none;transition:opacity .3s;
  }
  #topbtns.on{opacity:1;pointer-events:auto;}
  .iconBtn{
    width:38px;height:38px;border-radius:12px;
    background:rgba(10,6,30,.55);
    border:1px solid rgba(0,229,255,.3);
    color:#7df9ff;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);
    transition:.2s;font-family:inherit;
  }
  .iconBtn:hover{background:rgba(0,229,255,.16);box-shadow:0 0 18px rgba(0,229,255,.4);}
  .iconBtn:active{transform:scale(.92);}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .overlay.on > *{animation:fadeUp .45s backwards;}
  .overlay.on > *:nth-child(1){animation-delay:.02s;}
  .overlay.on > *:nth-child(2){animation-delay:.08s;}
  .overlay.on > *:nth-child(3){animation-delay:.14s;}
  .overlay.on > *:nth-child(4){animation-delay:.2s;}
  .overlay.on > *:nth-child(5){animation-delay:.26s;}
  .overlay.on > *:nth-child(6){animation-delay:.32s;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel" id="lives"></div>
  <div class="panel">
    <div class="stat"><span class="label">امتیاز</span><span class="val" id="scoreEl">0</span></div>
    <div class="stat"><span class="label">موج</span><span class="val" id="waveEl">1</span></div>
  </div>
</div>

<div id="bossbar">
  <div class="frame"><div id="bossfill"></div></div>
  <div class="cap">غولِ مرحله</div>
</div>

<div id="topbtns">
  <button class="iconBtn" id="btnPause" title="توقف">⏸</button>
  <button class="iconBtn" id="btnMute" title="صدا">🔊</button>
</div>

<!-- ===== MENU ===== -->
<div class="overlay on" id="menu">
  <h1>نئون‌گَرد</h1>
  <p class="sub">در اعماق فضای نئونی، تا آخرین نفس بجنگ</p>
  <button class="btn" id="btnStart">شروع بازی</button>
  <div class="hints">
    <span>🖱️ با <b>ماوس</b> یا <b>لمس</b> حرکت کن — شلیک خودکار است</span>
    <span>⌨️ یا با کلیدهای <span class="key">WASD</span> / <span class="key">جهت‌دار</span></span>
    <span>💎 جعبه‌های نئونی را بگیر: اسلحه، سپر، جان</span>
    <span>👾 هر ۵ موج، یک <b>غول</b> ظهور می‌کند</span>
  </div>
</div>

<!-- ===== PAUSE ===== -->
<div class="overlay" id="pause">
  <h1 style="font-size:clamp(30px,8vw,50px)">توقف</h1>
  <button class="btn" id="btnResume">ادامه</button>
  <button class="btn pink" id="btnQuit">بازگشت به منو</button>
</div>

<!-- ===== GAME OVER ===== -->
<div class="overlay" id="over">
  <h1 style="font-size:clamp(30px,9vw,56px)">پایان بازی</h1>
  <div class="scoreRow">
    <div class="scoreCell">
      <span class="k">امتیاز</span>
      <span class="scoreBig" id="finalScore">0</span>
    </div>
    <div class="scoreCell">
      <span class="k">برترین</span>
      <span class="scoreBig best" id="bestScore">0</span>
    </div>
  </div>
  <p class="sub" id="overMsg"></p>
  <button class="btn" id="btnRestart">دوباره بجنگ</button>
  <button class="btn pink" id="btnMenu">منوی اصلی</button>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   CANVAS
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildStars();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* =========================================================
   UTILS
   ========================================================= */
const rand    = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a, b+1));
const clamp   = (v,a,b) => v < a ? a : (v > b ? b : v);
const TAU = Math.PI * 2;

/* =========================================================
   AUDIO ENGINE (Web Audio API — all synthesized)
   ========================================================= */
let actx = null, masterGain = null, muted = false;

function initAudio(){
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    masterGain = actx.createGain();
    masterGain.gain.value = muted ? 0 : 0.5;
    masterGain.connect(actx.destination);
  }catch(e){ actx = null; }
}

function tone(freq, dur, type, vol, slideTo, delay){
  if (!actx || muted) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.02);
}

function noiseBurst(dur, vol, f0, f1, q){
  if (!actx || muted) return;
  const t = actx.currentTime;
  const len = Math.max(1, Math.floor(actx.sampleRate * dur));
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){
    d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 1.7);
  }
  const src = actx.createBufferSource();
  src.buffer = buf;
  const filt = actx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.Q.value = q || 1;
  filt.frequency.setValueAtTime(f0, t);
  filt.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + dur + 0.02);
}

const SFX = {
  shoot(){ tone(1050, 0.075, 'square', 0.035, 320); },
  shootBig(){ tone(680, 0.1, 'sawtooth', 0.045, 180); },
  hit(){ tone(300, 0.06, 'square', 0.05, 140); },
  explode(){ noiseBurst(0.35, 0.28, 1800, 90, 1.2); tone(140, 0.28, 'sine', 0.09, 40); },
  bigExplode(){
    noiseBurst(0.9, 0.42, 2400, 60, 1.4);
    tone(90, 0.8, 'sine', 0.16, 28);
    tone(180, 0.5, 'sawtooth', 0.07, 40, 0.05);
  },
  powerup(){
    tone(620, 0.09, 'sine', 0.09);
    tone(930, 0.09, 'sine', 0.09, null, 0.07);
    tone(1240, 0.14, 'sine', 0.08, null, 0.14);
  },
  playerHit(){
    noiseBurst(0.4, 0.3, 900, 60, 2);
    tone(220, 0.35, 'sawtooth', 0.12, 55);
  },
  bossWarn(){
    tone(180, 0.55, 'sawtooth', 0.10, 180);
    tone(240, 0.55, 'square', 0.05, 240, 0.25);
  },
  wave(){
    tone(520, 0.1, 'triangle', 0.06);
    tone(780, 0.16, 'triangle', 0.06, null, 0.09);
  },
  gameOver(){
    tone(420, 0.35, 'sawtooth', 0.10, 300);
    tone(300, 0.4, 'sawtooth', 0.10, 200, 0.22);
    tone(180, 0.9, 'sine', 0.12, 60, 0.45);
  }
};

/* =========================================================
   STATE
   ========================================================= */
const STATE = { MENU:'menu', PLAY:'play', PAUSE:'pause', OVER:'over' };
let state = STATE.MENU;

let player, bullets, eBullets, enemies, boss, particles, powerups, floats, stars;
let wave, spawnQueue, spawnTimer, waveCooldown, score, best, time, shakeT, shakeMag;
let flashAlpha = 0, flashColor = '#fff';

best = parseInt(localStorage.getItem('neonrunner_best') || '0', 10) || 0;

/* =========================================================
   STARS
   ========================================================= */
function buildStars(){
  stars = [];
  const n = Math.min(220, Math.floor((W * H) / 6500));
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: rand(0.15, 1),
      s: rand(0.6, 2.0)
    });
  }
}

function updateStars(dt, speedMul){
  const m = speedMul === undefined ? 1 : speedMul;
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    s.y += (18 + s.z * 230) * dt * m;
    if (s.y > H + 4){ s.y = -4; s.x = Math.random() * W; }
  }
}

/* =========================================================
   PARTICLES / FLOATS
   ========================================================= */
function spawnParticles(x, y, color, count, power, spread){
  const p = power || 1;
  const sp = spread === undefined ? 1 : spread;
  for (let i = 0; i < count; i++){
    if (particles.length > 520) break;
    const a = Math.random() * TAU;
    const v = rand(30, 280) * p;
    particles.push({
      x, y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v * sp,
      life: rand(0.28, 0.85),
      max: 0.85,
      r: rand(1.2, 3.8) * p,
      color
    });
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= (1 - 2.4 * dt);
    p.vy *= (1 - 2.4 * dt);
    p.vy += 40 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a * a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.8), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function addFloat(x, y, text, color){
  floats.push({ x, y, text, color, life: 1.1, max: 1.1 });
}
function updateFloats(dt){
  for (let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.y -= 46 * dt;
    f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
}
function drawFloats(){
  ctx.textAlign = 'center';
  ctx.font = 'bold 15px Tahoma, sans-serif';
  for (let i = 0; i < floats.length; i++){
    const f = floats[i];
    const a = clamp(f.life / f.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 14;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

/* =========================================================
   PLAYER
   ========================================================= */
function createPlayer(){
  return {
    x: W / 2,
    y: H - Math.min(150, H * 0.22),
    r: 15,
    speed: 520,
    hp: 3,
    maxHp: 5,
    shield: 0,
    weapon: 1,
    fireCd: 0,
    invuln: 1.6,
    tilt: 0,
    engine: 0
  };
}

function updatePlayer(dt){
  const p = player;
  if (p.invuln > 0) p.invuln -= dt;
  p.engine += dt * 22;

  let dx = 0, dy = 0;

  if (usePointer){
    const tx = pointer.x;
    const ty = pointer.y;
    const ddx = tx - p.x, ddy = ty - p.y;
    const d = Math.hypot(ddx, ddy);
    const step = p.speed * 1.5 * dt;
    if (d > 0.8){
      const k = Math.min(d, step) / d;
      dx = ddx * k;
      dy = ddy * k;
    }
  } else {
    let mx = 0, my = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) mx -= 1;
    if (keys['ArrowRight']|| keys['d'] || keys['D']) mx += 1;
    if (keys['ArrowUp']   || keys['w'] || keys['W']) my -= 1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) my += 1;
    if (mx || my){
      const len = Math.hypot(mx, my);
      dx = (mx / len) * p.speed * dt;
      dy = (my / len) * p.speed * dt;
    }
  }

  p.x += dx;
  p.y += dy;

  // tilt based on horizontal movement
  const targetTilt = clamp(dx * 0.055, -0.42, 0.42);
  p.tilt += (targetTilt - p.tilt) * Math.min(1, dt * 12);

  const pad = p.r + 6;
  p.x = clamp(p.x, pad, W - pad);
  p.y = clamp(p.y, pad + 50, H - pad);

  // auto fire
  p.fireCd -= dt;
  if (p.fireCd <= 0){
    shootPlayer();
    p.fireCd = [0.155, 0.135, 0.115, 0.098][Math.min(p.weapon, 4) - 1];
  }
}

function shootPlayer(){
  const p = player;
  const spd = -900;
  const lvl = p.weapon;
  const add = (x, y, vx, vy, r, dmg) => bullets.push({ x, y, vx, vy, r, dmg, life: 2.2 });

  if (lvl === 1){
    add(p.x, p.y - 20, 0, spd, 3.2, 1);
    SFX.shoot();
  } else if (lvl === 2){
    add(p.x - 8, p.y - 14, 0, spd, 3.2, 1);
    add(p.x + 8, p.y - 14, 0, spd, 3.2, 1);
    SFX.shoot();
  } else if (lvl === 3){
    add(p.x, p.y - 22, 0, spd, 3.6, 1.4);
    add(p.x - 12, p.y - 8, -170, spd * 0.94, 2.8, 1);
    add(p.x + 12, p.y - 8,  170, spd * 0.94, 2.8, 1);
    SFX.shoot();
  } else {
    add(p.x - 5, p.y - 22, 0, spd, 3.6, 1.4);
    add(p.x + 5, p.y - 22, 0, spd, 3.6, 1.4);
    add(p.x - 15, p.y - 6, -260, spd * 0.9, 3, 1);
    add(p.x + 15, p.y - 6,  260, spd * 0.9, 3, 1);
    add(p.x - 18, p.y + 2, -420, spd * 0.75, 2.6, 0.8);
    add(p.x + 18, p.y + 2,  420, spd * 0.75, 2.6, 0.8);
    SFX.shootBig();
  }

  // muzzle flash
  particles.push({
    x: p.x, y: p.y - 22, vx: 0, vy: -60,
    life: 0.09, max: 0.09, r: 7, color: '#bff9ff'
  });
}

function drawPlayer(){
  const p = player;
  if (p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0) return;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.tilt);

  // engine flame
  const fl = 16 + Math.sin(p.engine) * 5;
  const grad = ctx.createLinearGradient(0, 12, 0, 12 + fl);
  grad.addColorStop(0, 'rgba(0,229,255,.95)');
  grad.addColorStop(0.45, 'rgba(120,90,255,.6)');
  grad.addColorStop(1, 'rgba(255,45,149,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-6, 10);
  ctx.lineTo(6, 10);
  ctx.lineTo(0, 12 + fl);
  ctx.closePath();
  ctx.fill();

  // ship body
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 20;
  const body = ctx.createLinearGradient(0, -22, 0, 20);
  body.addColorStop(0, '#e8feff');
  body.addColorStop(0.35, '#4fd8ff');
  body.addColorStop(1, '#0a6f9e');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(6, -8);
  ctx.lineTo(11, 4);
  ctx.lineTo(19, 14);
  ctx.lineTo(8, 11);
  ctx.lineTo(0, 17);
  ctx.lineTo(-8, 11);
  ctx.lineTo(-19, 14);
  ctx.lineTo(-11, 4);
  ctx.lineTo(-6, -8);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(190,250,255,.9)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // cockpit
  ctx.fillStyle = 'rgba(10,30,60,.85)';
  ctx.beginPath();
  ctx.ellipse(0, -6, 3.6, 7.5, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(180,250,255,.85)';
  ctx.beginPath();
  ctx.ellipse(-0.8, -8.5, 1.5, 3.2, 0, 0, TAU);
  ctx.fill();

  // wing tips light
  ctx.fillStyle = '#ff2d95';
  ctx.shadowColor = '#ff2d95';
  ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(-19, 14, 2.1, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(19, 14, 2.1, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();

  // shield ring
  if (p.shield > 0){
    const pulse = 0.72 + Math.sin(time * 7) * 0.18;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(0,229,255,' + pulse + ')';
    ctx.lineWidth = 2.2;
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 13, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

/* =========================================================
   ENEMIES
   ========================================================= */
const ENEMY_DEF = {
  grunt: { hp: 2, r: 15, speed: 118, color: '#ff4d6d', score: 10, fireRate: 1.9 },
  zig:   { hp: 2, r: 14, speed: 155, color: '#ffd166', score: 15, fireRate: 2.3 },
  tank:  { hp: 7, r: 24, speed: 68,  color: '#a06bff', score: 35, fireRate: 2.6 },
  diver: { hp: 3, r: 15, speed: 105, color: '#ff8a3d', score: 25, fireRate: 0 }
};

function makeEnemy(type, x, y){
  const d = ENEMY_DEF[type];
  const hpScale = 1 + (wave - 1) * 0.16;
  const hp = Math.max(1, Math.round(d.hp * hpScale));
  return {
    type, x, y,
    r: d.r,
    hp, maxHp: hp,
    speed: d.speed * (1 + (wave - 1) * 0.035),
    color: d.color,
    score: d.score,
    fireRate: d.fireRate ? d.fireRate * rand(0.75, 1.25) : 0,
    fireTimer: d.fireRate ? rand(0.6, 1.6) : 0,
    t: Math.random() * TAU,
    flash: 0,
    rot: 0,
    rotSpd: rand(-2.4, 2.4)
  };
}

function pickEnemyType(){
  const pool = ['grunt', 'grunt', 'grunt', 'zig'];
  if (wave >= 2) pool.push('zig');
  if (wave >= 3) pool.push('tank', 'zig');
  if (wave >= 4) pool.push('diver', 'diver');
  if (wave >= 6) pool.push('tank', 'diver');
  if (wave >= 8) pool.push('tank', 'diver', 'zig');
  return pool[randInt(0, pool.length - 1)];
}

function spawnEnemy(type){
  const margin = 46;
  const x = rand(margin, Math.max(margin + 1, W - margin));
  enemies.push(makeEnemy(type, x, -50));
}

function enemyShoot(e){
  const spd = 250 + wave * 8;
  if (e.type === 'grunt'){
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    eBullets.push({ x: e.x, y: e.y + 10, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 5, color: '#ff6b8a' });
  } else if (e.type === 'zig'){
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    for (let i = -1; i <= 1; i++){
      const a = ang + i * 0.2;
      eBullets.push({ x: e.x, y: e.y + 8, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4.5, color: '#ffd166' });
    }
  } else if (e.type === 'tank'){
    for (let i = 0; i < 6; i++){
      const a = (i / 6) * TAU + e.t;
      eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * spd * 0.72, vy: Math.sin(a) * spd * 0.72, r: 5.5, color: '#c39bff' });
    }
  }
  tone(320, 0.08, 'square', 0.03, 180);
}

function updateEnemies(dt){
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    e.t += dt;
    e.rot += e.rotSpd * dt;
    if (e.flash > 0) e.flash -= dt;

    switch (e.type){
      case 'grunt':
        e.y += e.speed * dt;
        break;
      case 'zig':
        e.y += e.speed * 0.7 * dt;
        e.x += Math.sin(e.t * 3.4) * 175 * dt;
        break;
      case 'tank':
        e.y += e.speed * dt;
        e.x += Math.sin(e.t * 1.3) * 45 * dt;
        break;
      case 'diver':
        if (e.t < 0.75){
          e.y += e.speed * dt;
        } else {
          const dx = player.x - e.x, dy = player.y - e.y;
          const d = Math.hypot(dx, dy) || 1;
          e.x += (dx / d) * e.speed * 1.35 * dt;
          e.y += (dy / d) * e.speed * 1.35 * dt;
        }
        break;
    }

    e.x = clamp(e.x, e.r + 4, W - e.r - 4);

    // shooting
    if (e.fireRate && e.y > 20 && e.y < H * 0.82){
      e.fireTimer -= dt;
      if (e.fireTimer <= 0){
        enemyShoot(e);
        e.fireTimer = e.fireRate * rand(0.8, 1.35);
      }
    }

    // off-screen cleanup
    if (e.y > H + 70 || e.x < -120 || e.x > W + 120){
      enemies.splice(i, 1);
      continue;
    }

    // collision with player
    if (player.invuln <= 0){
      const rr = e.r + player.r - 2;
      const ddx = e.x - player.x, ddy = e.y - player.y;
      if (ddx*ddx + ddy*ddy < rr*rr){
        damagePlayer();
        e.hp -= 3;
        e.flash = 0.12;
        if (e.hp <= 0){ killEnemy(i); }
        continue;
      }
    }
  }
}

function killEnemy(index){
  const e = enemies[index];
  if (!e) return;
  spawnParticles(e.x, e.y, e.color, 16 + Math.floor(e.r), e.r / 18);
  spawnParticles(e.x, e.y, '#ffffff', 6, 0.8);
  SFX.explode();

  score += e.score;
  addFloat(e.x, e.y - 8, '+' + e.score, '#7df9ff');

  shakeT = Math.max(shakeT, 0.14);
  shakeMag = Math.max(shakeMag, 5);

  maybeDropPowerup(e.x, e.y);
  enemies.splice(index, 1);
  updateHUD();
}

function drawEnemies(){
  for (let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    ctx.save();
    ctx.translate(e.x, e.y);

    const col = e.flash > 0 ? '#ffffff' : e.color;
    ctx.shadowColor = col;
    ctx.shadowBlur = 16;
    ctx.fillStyle = col;

    if (e.type === 'grunt'){
      ctx.beginPath();
      ctx.moveTo(0, e.r);
      ctx.lineTo(e.r * 0.95, -e.r * 0.55);
      ctx.lineTo(0, -e.r * 0.2);
      ctx.lineTo(-e.r * 0.95, -e.r * 0.55);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(10,4,20,.85)';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.28, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, -e.r * 0.55, 2, 0, TAU); ctx.fill();

    } else if (e.type === 'zig'){
      ctx.rotate(e.rot * 0.6);
      ctx.beginPath();
      ctx.moveTo(0, e.r);
      ctx.lineTo(e.r, 0);
      ctx.lineTo(0, -e.r);
      ctx.lineTo(-e.r, 0);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(20,10,0,.7)';
      ctx.beginPath();
      ctx.moveTo(0, e.r * 0.5);
      ctx.lineTo(e.r * 0.5, 0);
      ctx.lineTo(0, -e.r * 0.5);
      ctx.lineTo(-e.r * 0.5, 0);
      ctx.closePath();
      ctx.fill();

    } else if (e.type === 'tank'){
      ctx.rotate(e.rot * 0.3);
      ctx.beginPath();
      for (let k = 0; k < 6; k++){
        const a = (k / 6) * TAU - Math.PI / 2;
        const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(15,5,35,.85)';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.48, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e6d4ff';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.2, 0, TAU); ctx.fill();
      // health ring
      ctx.strokeStyle = 'rgba(255,255,255,.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, e.r + 4, -Math.PI / 2, -Math.PI / 2 + TAU * (e.hp / e.maxHp));
      ctx.stroke();

    } else if (e.type === 'diver'){
      const ang = Math.atan2(player.y - e.y, player.x - e.x) + Math.PI / 2;
      ctx.rotate(e.t > 0.75 ? ang : 0);
      ctx.beginPath();
      ctx.moveTo(0, e.r * 1.15);
      ctx.lineTo(e.r * 0.75, -e.r * 0.8);
      ctx.lineTo(0, -e.r * 0.35);
      ctx.lineTo(-e.r * 0.75, -e.r * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(0, e.r * 0.35, 2.2, 0, TAU); ctx.fill();
    }

    ctx.restore();
  }
}

/* =========================================================
   BOSS
   ========================================================= */
function spawnBoss(){
  const hp = 130 + wave * 32;
  boss = {
    x: W / 2,
    y: -140,
    r: 62,
    hp, maxHp: hp,
    entering: true,
    t: 0,
    attackTimer: 2.4,
    attackIndex: 0,
    flash: 0,
    rot: 0,
    ringRot: 0
  };
  SFX.bossWarn();
  document.getElementById('bossbar').classList.add('on');
  document.getElementById('bossfill').style.width = '100%';
  addFloat(W / 2, H * 0.32, '⚠ غولِ مرحله ⚠', '#ff2d95');
}

function updateBoss(dt){
  if (!boss) return;
  const b = boss;
  b.t += dt;
  b.rot += dt * 0.5;
  b.ringRot -= dt * 1.1;
  if (b.flash > 0) b.flash -= dt;

  if (b.entering){
    b.y += 105 * dt;
    if (b.y >= 145){ b.y = 145; b.entering = false; b.attackTimer = 1.4; }
    return;
  }

  const sway = Math.sin(b.t * 0.62);
  b.x = W / 2 + sway * Math.min(W * 0.33, 260);
  b.y = 145 + Math.sin(b.t * 1.25) * 22;

  // attacks
  b.attackTimer -= dt;
  if (b.attackTimer <= 0){
    bossAttack(b);
    b.attackIndex++;
    const rage = b.hp / b.maxHp < 0.4 ? 0.62 : 1;
    b.attackTimer = Math.max(0.75, (1.85 - wave * 0.03)) * rage * rand(0.85, 1.2);
  }

  // contact damage
  if (player.invuln <= 0){
    const rr = b.r * 0.8 + player.r;
    const dx = b.x - player.x, dy = b.y - player.y;
    if (dx*dx + dy*dy < rr*rr) damagePlayer();
  }
}

function bossAttack(b){
  const spd = 235 + wave * 7;
  const idx = b.attackIndex % 4;

  if (idx === 0){
    // radial burst
    const n = 16;
    for (let i = 0; i < n; i++){
      const a = (i / n) * TAU + b.t * 0.6;
      eBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * spd * 0.8, vy: Math.sin(a) * spd * 0.8, r: 6, color: '#ff5c8a' });
    }
    tone(160, 0.22, 'sawtooth', 0.08, 70);

  } else if (idx === 1){
    // aimed shotgun
    const base = Math.atan2(player.y - b.y, player.x - b.x);
    for (let i = -3; i <= 3; i++){
      const a = base + i * 0.13;
      eBullets.push({ x: b.x, y: b.y + 20, vx: Math.cos(a) * spd * 1.15, vy: Math.sin(a) * spd * 1.15, r: 5.5, color: '#ffb03d' });
    }
    tone(240, 0.16, 'square', 0.06, 120);

  } else if (idx === 2){
    // curtain with a gap
    const gap = randInt(0, 9);
    for (let i = 0; i < 11; i++){
      if (i === gap || i === gap + 1) continue;
      const x = (i + 0.5) * (W / 11);
      eBullets.push({ x, y: b.y - 10, vx: 0, vy: spd * 0.85, r: 6.5, color: '#c39bff' });
    }
    noiseBurst(0.2, 0.12, 900, 200);

  } else {
    // spinning double spiral
    for (let s = 0; s < 2; s++){
      const baseA = b.t * 2.4 + s * Math.PI;
      for (let i = 0; i < 5; i++){
        const a = baseA + (i / 5) * TAU;
        eBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * spd * 0.7, vy: Math.sin(a) * spd * 0.7, r: 5, color: '#ff2d95' });
      }
    }
    tone(420, 0.3, 'triangle', 0.05, 150);
  }
}

function drawBoss(){
  if (!boss) return;
  const b = boss;

  ctx.save();
  ctx.translate(b.x, b.y);

  // outer rotating ring
  ctx.save();
  ctx.rotate(b.ringRot);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,45,149,.55)';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ff2d95';
  ctx.shadowBlur = 18;
  for (let k = 0; k < 3; k++){
    ctx.beginPath();
    ctx.arc(0, 0, b.r + 14 + k * 9, k * 1.1, k * 1.1 + 1.5);
    ctx.stroke();
  }
  ctx.restore();

  // hull
  const col = b.flash > 0 ? '#ffffff' : '#ff2d95';
  ctx.shadowColor = col;
  ctx.shadowBlur = 26;

  const g = ctx.createLinearGradient(0, -b.r, 0, b.r);
  g.addColorStop(0, b.flash > 0 ? '#ffffff' : '#ff8ab5');
  g.addColorStop(0.5, b.flash > 0 ? '#ffffff' : '#c81e6b');
  g.addColorStop(1, b.flash > 0 ? '#ffffff' : '#4a0d2c');
  ctx.fillStyle = g;

  ctx.beginPath();
  ctx.moveTo(0, b.r * 1.05);
  ctx.lineTo(b.r * 0.62, b.r * 0.72);
  ctx.lineTo(b.r * 1.25, b.r * 0.18);
  ctx.lineTo(b.r * 0.92, -b.r * 0.5);
  ctx.lineTo(b.r * 0.4, -b.r * 0.95);
  ctx.lineTo(-b.r * 0.4, -b.r * 0.95);
  ctx.lineTo(-b.r * 0.92, -b.r * 0.5);
  ctx.lineTo(-b.r * 1.25, b.r * 0.18);
  ctx.lineTo(-b.r * 0.62, b.r * 0.72);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,220,240,.85)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // core
  const pulse = 0.6 + Math.sin(time * 6) * 0.4;
  ctx.globalCompositeOperation = 'lighter';
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r * 0.55);
  cg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * pulse) + ')');
  cg.addColorStop(0.4, 'rgba(255,209,102,' + (0.7 * pulse) + ')');
  cg.addColorStop(1, 'rgba(255,45,149,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(0, 0, b.r * 0.55, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // eyes
  ctx.fillStyle = '#ffe9f3';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.ellipse(-b.r * 0.35, -b.r * 0.28, 4.5, 7, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( b.r * 0.35, -b.r * 0.28, 4.5, 7, 0, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();
}

/* =========================================================
   BULLETS
   ========================================================= */
function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.y < -30 || b.x < -40 || b.x > W + 40 || b.life <= 0){
      bullets.splice(i, 1);
      continue;
    }

    let hit = false;

    // vs enemies
    for (let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      const rr = e.r + b.r;
      const dx = e.x - b.x, dy = e.y - b.y;
      if (dx*dx + dy*dy < rr*rr){
        e.hp -= b.dmg;
        e.flash = 0.09;
        spawnParticles(b.x, b.y - 4, '#bff9ff', 4, 0.5);
        SFX.hit();
        if (e.hp <= 0) killEnemy(j);
        hit = true;
        break;
      }
    }

    // vs boss
    if (!hit && boss && !boss.entering){
      const rr = boss.r * 0.82 + b.r;
      const dx = boss.x - b.x, dy = boss.y - b.y;
      if (dx*dx + dy*dy < rr*rr){
        boss.hp -= b.dmg;
        boss.flash = 0.07;
        spawnParticles(b.x, b.y, '#ffd166', 5, 0.6);
        SFX.hit();
        document.getElementById('bossfill').style.width =
          Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
        if (boss.hp <= 0) killBoss();
        hit = true;
      }
    }

    if (hit) bullets.splice(i, 1);
  }

  // enemy bullets
  for (let i = eBullets.length - 1; i >= 0; i--){
    const b = eBullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y > H + 40 || b.y < -80 || b.x < -60 || b.x > W + 60){
      eBullets.splice(i, 1);
      continue;
    }
    if (player.invuln <= 0){
      const rr = player.r + b.r - 1;
      const dx = b.x - player.x, dy = b.y - player.y;
      if (dx*dx + dy*dy < rr*rr){
        eBullets.splice(i, 1);
        damagePlayer();
      }
    }
  }
}

function killBoss(){
  const b = boss;
  const bx = b.x, by = b.y;
  boss = null;
  document.getElementById('bossbar').classList.remove('on');

  SFX.bigExplode();
  shakeT = 0.85; shakeMag = 22;
  flashAlpha = 0.55; flashColor = '#ff8ab5';

  for (let k = 0; k < 9; k++){
    setTimeout(() => {
      spawnParticles(bx + rand(-70, 70), by + rand(-55, 55), ['#ff2d95','#ffd166','#ffffff','#00e5ff'][randInt(0,3)], 26, 1.6);
      shakeT = Math.max(shakeT, 0.35);
      shakeMag = Math.max(shakeMag, 14);
      SFX.explode();
    }, k * 95);
  }

  score += 500 + wave * 40;
  addFloat(bx, by, '+' + (500 + wave * 40), '#ffd166');
  updateHUD();

  // reward drops
  for (let i = 0; i < 3; i++){
    powerups.push(makePowerup(bx + rand(-60, 60), by + rand(-30, 30), ['gun','shield','heal'][i]));
  }

  // clear bullets
  eBullets.length = 0;
}

function drawBullets(){
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < bullets.length; i++){
    const b = bullets[i];
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3.6);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, '#7df9ff');
    g.addColorStop(1, 'rgba(0,229,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 3.6, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#eaffff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.75, 0, TAU);
    ctx.fill();
  }

  for (let i = 0; i < eBullets.length; i++){
    const b = eBullets[i];
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3.2);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.3, b.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 3.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.62, 0, TAU);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* =========================================================
   POWERUPS
   ========================================================= */
const PU_COLORS = { gun: '#00e5ff', shield: '#5c8dff', heal: '#ff4d9d' };
const PU_LABELS = { gun: 'W', shield: 'S', heal: '+' };

function makePowerup(x, y, type){
  return { x, y, type, r: 15, t: rand(0, TAU), vy: 95, vx: rand(-25, 25), life: 12 };
}

function maybeDropPowerup(x, y){
  const roll = Math.random();
  if (roll < 0.055) powerups.push(makePowerup(x, y, 'gun'));
  else if (roll < 0.095) powerups.push(makePowerup(x, y, 'shield'));
  else if (roll < 0.125) powerups.push(makePowerup(x, y, 'heal'));
}

function updatePowerups(dt){
  for (let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i];
    p.t += dt;
    p.life -= dt;
    p.y += p.vy * dt;
    p.x += Math.sin(p.t * 2.2) * 40 * dt + p.vx * dt;

    if (p.y > H + 40 || p.life <= 0){ powerups.splice(i, 1); continue; }

    const rr = p.r + player.r + 6;
    const dx = p.x - player.x, dy = p.y - player.y;
    if (dx*dx + dy*dy < rr*rr){
      collectPowerup(p);
      powerups.splice(i, 1);
    }
  }
}

function collectPowerup(p){
  SFX.powerup();
  spawnParticles(p.x, p.y, PU_COLORS[p.type], 20, 1.1);
  flashAlpha = Math.max(flashAlpha, 0.18);
  flashColor = PU_COLORS[p.type];

  if (p.type === 'gun'){
    if (player.weapon < 4){
      player.weapon++;
      addFloat(p.x, p.y - 10, 'اسلحه سطح ' + player.weapon, '#00e5ff');
    } else {
      score += 60;
      addFloat(p.x, p.y - 10, '+60', '#00e5ff');
    }
  } else if (p.type === 'shield'){
    player.shield = Math.min(2, player.shield + 1);
    addFloat(p.x, p.y - 10, 'سپر', '#5c8dff');
  } else if (p.type === 'heal'){
    if (player.hp < player.maxHp){
      player.hp++;
      addFloat(p.x, p.y - 10, '+۱ جان', '#ff4d9d');
    } else {
      score += 80;
      addFloat(p.x, p.y - 10, '+80', '#ff4d9d');
    }
  }
  updateHUD();
}

function drawPowerups(){
  for (let i = 0; i < powerups.length; i++){
    const p = powerups[i];
    const col = PU_COLORS[p.type];
    const blink = p.life < 3 ? (Math.sin(p.life * 18) * 0.5 + 0.5) : 1;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalAlpha = 0.45 + 0.55 * blink;

    // halo
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.r * 2.6);
    g.addColorStop(0, col);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha *= 0.55;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, p.r * 2.6, 0, TAU); ctx.fill();
    ctx.globalAlpha /= 0.55;
    ctx.globalCompositeOperation = 'source-over';

    ctx.rotate(p.t * 1.5);
    ctx.shadowColor = col;
    ctx.shadowBlur = 16;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.2;
    ctx.fillStyle = 'rgba(6,10,26,.75)';
    ctx.beginPath();
    const r = p.r * 0.85;
    for (let k = 0; k < 6; k++){
      const a = (k / 6) * TAU;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.rotate(-p.t * 1.5);
    ctx.shadowBlur = 10;
    ctx.fillStyle = col;
    ctx.font = 'bold 16px Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PU_LABELS[p.type], 0, 1);
    ctx.shadowBlur = 0;
    ctx.textBaseline = 'alphabetic';

    ctx.restore();
  }
}

/* =========================================================
   DAMAGE / DEATH
   ========================================================= */
function damagePlayer(){
  if (player.invuln > 0) return;

  if (player.shield > 0){
    player.shield--;
    player.invuln = 1.0;
    SFX.hit();
    spawnParticles(player.x, player.y, '#00e5ff', 22, 1.2);
    shakeT = 0.25; shakeMag = 10;
    flashAlpha = 0.2; flashColor = '#00e5ff';
    addFloat(player.x, player.y - 34, 'سپر شکست!', '#00e5ff');
    updateHUD();
    return;
  }

  player.hp--;
  player.invuln = 1.9;
  SFX.playerHit();
  spawnParticles(player.x, player.y, '#ff2d95', 28, 1.4);
  spawnParticles(player.x, player.y, '#ffffff', 10, 1);
  shakeT = 0.45; shakeMag = 18;
  flashAlpha = 0.4; flashColor = '#ff2d95';
  updateHUD();

  if (player.weapon > 1) player.weapon--;

  if (player.hp <= 0) gameOver();
}

/* =========================================================
   WAVES / SPAWNER
   ========================================================= */
function startWave(){
  wave++;
  spawnQueue.length = 0;
  waveCooldown = 1.7;
  updateHUD();

  if (wave % 5 === 0){
    spawnBoss();
  } else {
    const n = Math.min(5 + wave * 2, 26);
    for (let i = 0; i < n; i++) spawnQueue.push(pickEnemyType());
    spawnTimer = 0.7;
    SFX.wave();
    addFloat(W / 2, H * 0.3, 'موج ' + wave, '#7df9ff');
  }
}

function updateSpawner(dt){
  if (spawnQueue.length > 0){
    spawnTimer -= dt;
    if (spawnTimer <= 0){
      spawnEnemy(spawnQueue.shift());
      spawnTimer = Math.max(0.2, 0.85 - wave * 0.045);
    }
    return;
  }

  if (enemies.length === 0 && !boss){
    waveCooldown -= dt;
    if (waveCooldown <= 0) startWave();
  }
}

/* =========================================================
   INPUT
   ========================================================= */
const keys = {};
const pointer = { x: 0, y: 0, active: false };
let usePointer = true;

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) >= 0) e.preventDefault();

  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].indexOf(e.key) >= 0){
    usePointer = false;
  }
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P'){
    if (state === STATE.PLAY) pauseGame();
    else if (state === STATE.PAUSE) resumeGame();
  }
  if (e.key === ' ' && state === STATE.MENU) startGame();
});

window.addEventListener('keyup', e => { keys[e.key] = false; });

function pointerPos(e){
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('pointerdown', e => {
  initAudio();
  const p = pointerPos(e);
  pointer.x = p.x;
  pointer.y = p.y - (e.pointerType === 'touch' ? 62 : 0);
  pointer.active = true;
  usePointer = true;
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch(err){} }
});

canvas.addEventListener('pointermove', e => {
  const p = pointerPos(e);
  pointer.x = p.x;
  pointer.y = p.y - (e.pointerType === 'touch' ? 62 : 0);
  pointer.active = true;
  usePointer = true;
});

canvas.addEventListener('pointerup', () => { pointer.active = false; });
canvas.addEventListener('pointercancel', () => { pointer.active = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('blur', () => {
  if (state === STATE.PLAY) pauseGame();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === STATE.PLAY) pauseGame();
});

/* =========================================================
   HUD
   ========================================================= */
const hudEl      = document.getElementById('hud');
const livesEl    = document.getElementById('lives');
const scoreEl    = document.getElementById('scoreEl');
const waveEl     = document.getElementById('waveEl');
const bossbarEl  = document.getElementById('bossbar');
const bossfillEl = document.getElementById('bossfill');
const topbtnsEl  = document.getElementById('topbtns');

function updateHUD(){
  scoreEl.textContent = score.toLocaleString('fa-IR');
  waveEl.textContent = wave.toLocaleString('fa-IR');

  let html = '';
  for (let i = 0; i < player.maxHp; i++){
    html += '<div class="heart' + (i < player.hp ? '' : ' off') + '"></div>';
  }
  html += '<div style="width:9px"></div>';
  for (let i = 0; i < 2; i++){
    html += '<div class="shieldIcon' + (i < player.shield ? '' : ' off') + '"></div>';
  }
  livesEl.innerHTML = html;
}

/* =========================================================
   SCREEN SHAKE + FLASH
   ========================================================= */
function updateShake(dt){
  if (shakeT > 0){
    shakeT -= dt;
    if (shakeT <= 0){ shakeT = 0; shakeMag = 0; }
  }
  if (flashAlpha > 0){
    flashAlpha -= dt * 2.2;
    if (flashAlpha < 0) flashAlpha = 0;
  }
}

/* =========================================================
   BACKGROUND
   ========================================================= */
function drawBackground(){
  // base gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#07041a');
  g.addColorStop(0.45, '#0a0620');
  g.addColorStop(1, '#12042a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // nebula blobs
  ctx.globalCompositeOperation = 'lighter';
  const t = time * 0.08;
  const b1x = W * (0.5 + Math.sin(t) * 0.32);
  const b1y = H * (0.25 + Math.cos(t * 0.8) * 0.14);
  let ng = ctx.createRadialGradient(b1x, b1y, 0, b1x, b1y, Math.max(W, H) * 0.5);
  ng.addColorStop(0, 'rgba(80,20,140,.20)');
  ng.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = ng;
  ctx.fillRect(0, 0, W, H);

  const b2x = W * (0.5 + Math.cos(t * 0.7 + 2) * 0.35);
  const b2y = H * (0.6 + Math.sin(t * 0.9 + 1) * 0.2);
  ng = ctx.createRadialGradient(b2x, b2y, 0, b2x, b2y, Math.max(W, H) * 0.42);
  ng.addColorStop(0, 'rgba(0,90,140,.16)');
  ng.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = ng;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // stars
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = 0.22 + s.z * 0.72;
    ctx.globalAlpha = a;
    ctx.fillStyle = s.z > 0.75 ? '#cdf6ff' : (s.z > 0.45 ? '#8fd8ff' : '#6a7fb5');
    ctx.fillRect(s.x, s.y, s.s, s.s * (1 + s.z * 2.4));
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   GAME FLOW
   ========================================================= */
function resetGame(){
  player    = createPlayer();
  bullets   = [];
  eBullets  = [];
  enemies   = [];
  boss      = null;
  particles = [];
  powerups  = [];
  floats    = [];
  wave = 0;
  spawnQueue = [];
  spawnTimer = 0;
  waveCooldown = 0.6;
  score = 0;
  time = 0;
  shakeT = 0; shakeMag = 0;
  flashAlpha = 0; flashColor = '#fff';

  pointer.x = player.x;
  pointer.y = player.y;
  usePointer = true;

  bossbarEl.classList.remove('on');
  updateHUD();
}

function startGame(){
  initAudio();
  resetGame();
  state = STATE.PLAY;
  hideAllOverlays();
  hudEl.classList.add('on');
  topbtnsEl.classList.add('on');
  startWave();
  updateHUD();
}

function pauseGame(){
  if (state !== STATE.PLAY) return;
  state = STATE.PAUSE;
  document.getElementById('pause').classList.add('on');
}

function resumeGame(){
  if (state !== STATE.PAUSE) return;
  state = STATE.PLAY;
  document.getElementById('pause').classList.remove('on');
  last = performance.now();
}

function gameOver(){
  state = STATE.OVER;
  SFX.gameOver();
  shakeT = 0.9; shakeMag = 24;
  flashAlpha = 0.6; flashColor = '#ff2d95';
  spawnParticles(player.x, player.y, '#ff2d95', 40, 2);
  spawnParticles(player.x, player.y, '#ffffff', 18, 1.5);

  if (score > best){
    best = score;
    localStorage.setItem('neonrunner_best', String(best));
  }

  document.getElementById('finalScore').textContent = score.toLocaleString('fa-IR');
  document.getElementById('bestScore').textContent  = best.toLocaleString('fa-IR');

  const msgs = [
    'آفرین! رکورد جدید زدی 🔥',
    'نزدیک بود! یه بار دیگه امتحان کن',
    'نئون‌ها هنوز منتظرت هستن...',
    'عالی بود، ولی می‌شه بهتر کرد!',
    'دشمن‌ها داشتن بهت عادت می‌کردن!'
  ];
  document.getElementById('overMsg').textContent =
    (score >= best && score > 0) ? msgs[0] : msgs[randInt(1, msgs.length - 1)];

  setTimeout(() => {
    hudEl.classList.remove('on');
    topbtnsEl.classList.remove('on');
    document.getElementById('over').classList.add('on');
  }, 750);
}

function goToMenu(){
  state = STATE.MENU;
  hideAllOverlays();
  hudEl.classList.remove('on');
  topbtnsEl.classList.remove('on');
  bossbarEl.classList.remove('on');
  document.getElementById('menu').classList.add('on');
  resetGame();
  enemies = []; bullets = []; eBullets = []; powerups = []; particles = [];
}

function hideAllOverlays(){
  const ovs = document.querySelectorAll('.overlay');
  for (let i = 0; i < ovs.length; i++) ovs[i].classList.remove('on');
}

/* buttons */
document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnResume').addEventListener('click', resumeGame);
document.getElementById('btnQuit').addEventListener('click', goToMenu);
document.getElementById('btnRestart').addEventListener('click', startGame);
document.getElementById('btnMenu').addEventListener('click', goToMenu);

document.getElementById('btnPause').addEventListener('click', () => {
  if (state === STATE.PLAY) pauseGame();
  else if (state === STATE.PAUSE) resumeGame();
});

const btnMute = document.getElementById('btnMute');
btnMute.addEventListener('click', () => {
  initAudio();
  muted = !muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
  btnMute.textContent = muted ? '🔇' : '🔊';
});

/* =========================================================
   MAIN LOOP
   ========================================================= */
function update(dt){
  time += dt;

  updateStars(dt, 1);
  updatePlayer(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updatePowerups(dt);
  updateParticles(dt);
  updateFloats(dt);
  updateSpawner(dt);
  updateShake(dt);
}

function render(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.save();

  // screen shake
  if (shakeT > 0){
    const k = shakeT * 2.2;
    ctx.translate(rand(-1, 1) * shakeMag * k, rand(-1, 1) * shakeMag * k);
  }

  drawBackground();

  if (state !== STATE.MENU){
    drawPowerups();
    drawEnemies();
    drawBoss();
    drawBullets();
    if (state !== STATE.OVER && player.hp > 0) drawPlayer();
  }

  drawParticles();
  drawFloats();

  ctx.restore();

  // white/color flash
  if (flashAlpha > 0){
    ctx.globalAlpha = Math.min(0.7, flashAlpha);
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // vignette
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

let last = performance.now();
let menuTime = 0;

function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  if (state === STATE.PLAY){
    update(dt);
  } else if (state === STATE.MENU){
    menuTime += dt;
    time += dt;
    updateStars(dt, 0.55);
    updateParticles(dt);
    updateFloats(dt);
    updateShake(dt);
    // ambient drifting particles in menu
    if (Math.random() < 0.06 && particles.length < 120){
      particles.push({
        x: Math.random() * W,
        y: H + 10,
        vx: rand(-14, 14),
        vy: rand(-70, -28),
        life: rand(1.6, 3.2),
        max: 3.2,
        r: rand(1, 2.6),
        color: Math.random() < 0.5 ? '#00e5ff' : '#ff2d95'
      });
    }
  } else {
    // paused / over — keep particles alive and slowly fade
    updateParticles(dt);
    updateFloats(dt);
    updateShake(dt);
  }

  render();
}

/* =========================================================
   BOOT
   ========================================================= */
resize();
resetGame();
requestAnimationFrame(loop);

// keep audio context alive on first interaction anywhere
['pointerdown','keydown','touchstart'].forEach(ev => {
  window.addEventListener(ev, initAudio, { once: true, passive: true });
});

})();
</script>
